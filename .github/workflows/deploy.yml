name: Deploy site + Sphinx docs to GitHub Pages

on:
  push:
    branches: ["main", "feature/**"]
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to deploy"
        required: false
        default: "main"

permissions:
  contents: write

concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || github.ref }}

      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --frozen --group dev

      - name: Build Sphinx docs into site/docs/
        run: uv run sphinx-build docs/source site/docs

      - name: Place site into branch subdirectory
        run: |
          BRANCH=$(echo "${{ github.ref_name }}" | tr '/' '-')
          mkdir -p "public/$BRANCH"
          cp -r site/* "public/$BRANCH/"
          echo "$BRANCH" > public/.current-branch

      - name: Generate branch index page
        run: uv run python scripts/generate_branch_index.py

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          keep_files: true

      - name: Report deployed URL
        run: |
          BRANCH=$(cat public/.current-branch)
          echo "Deployed to: https://senderic.github.io/sender-trades/${BRANCH}/"
