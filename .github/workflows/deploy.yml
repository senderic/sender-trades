name: Deploy site + Sphinx docs to GitHub Pages

on:
  push:
    branches: ["main", "feature/**"]
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to deploy"
        required: false
        default: "main"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || github.ref }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --frozen --group dev

      - name: Build Sphinx docs into site/docs/
        run: uv run sphinx-build docs/source site/docs

      - name: Place site into branch subdirectory
        run: |
          BRANCH=$(echo "${{ github.ref_name }}" | tr '/' '-')
          if [ "$BRANCH" != "main" ]; then
            mkdir -p "public/$BRANCH"
            cp -r site/* "public/$BRANCH/"
          else
            mkdir -p public
            cp -r site/* public/
          fi

      - name: Upload artifact
        if: ${{ !env.ACT }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        if: ${{ !env.ACT }}
        id: deployment
        uses: actions/deploy-pages@v4
