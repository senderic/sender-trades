general:
  env_mode: PAPER_ALPACA
  target_assets:
    - SPY
    - QQQ
  execute: true
  require_forecast_alignment: true

atlas_briefing:
  directory: ~/atlas-morning-briefing
  briefings_subdir: briefings
  snapshot_enabled: true

finnhub:
  api_key: ${FINNHUB_API_KEY}
  request_timeout_sec: 10

alpha_vantage:
  api_key: ${ALPHA_VANTAGE_API_KEY}
  request_timeout_sec: 10

brave:
  api_key: ${BRAVE_API_KEY}
  news_query: "SPY QQQ stock market intraday trading"

reddit:
  enabled: true
  subreddits:
    - wallstreetbets
    - options
  post_limit: 25

unusual_whales:
  enabled: true
  api_key: ${UNUSUAL_WHALES_API_KEY}

rss_feeds:
  - url: https://feeds.content.dowjones.io/public/rss/mw_topstories
  - url: https://www.investing.com/rss/news.rss
  - url: https://seekingalpha.com/feed.xml
  - url: https://www.reutersagency.com/feed/

strategies:
  momentum:
    enabled: true
    min_confidence: 0.40
    gap_threshold_pct: 0.5
    max_confidence: 0.50
  mean_reversion:
    enabled: true
    min_confidence: 0.40
    rsi_oversold: 35
    rsi_overbought: 65
  event_driven:
    enabled: true
    min_confidence: 0.45
    catalyst_window_hours: 17

risk:
  max_loss_per_trade_usd: 500
  max_position_size_contracts: 10
  sizing_tier2_min_confidence: 0.60
  # Minimum absolute predicted move (in %) for a trade to be executed.
  # A 68%-accurate direction call on a 0.1-0.2% move still dies to 0DTE
  # theta, so only trade when the model expects a meaningful session move.
  min_predicted_move_pct: 0.30
  # Tie-break preference across assets at equal confidence. QQQ has shown
  # better accuracy and PnL than SPY across the whole history.
  preferred_asset: QQQ
  # Premium-aware entry gate (2026-09-10 audit of logs/, 2026-07-29..09-09):
  # predicted moves ran ~3x hotter than the underlying's actual intraday
  # move (e.g. 2026-09-09 predicted SPY -0.7%/QQQ -0.8%, actual -0.22%/
  # -0.01%). DecisionAggregator.premium_gate compares predicted move x
  # this factor against the option's true breakeven (OTM distance to
  # strike + ask, as a % of the underlying), in ExecutionEngine once the
  # live ask and a live underlying quote are known post-open.
  # Loosened 0.4 -> 1.0 (owner decision, 2026-09-11). A sweep over the 22
  # real fills showed no shrink value separates winners from losers --
  # kept-trade P&L was +$135..+$210 at every value from 0.4 to 1.2, carried
  # by one +$282 ITM put -- so this only sets frequency: 0.4 kept 2 of 22,
  # 1.0 keeps 9 (5 winners, +$195.50). Above ~1.2 the gate stops filtering
  # (1.5 kept 14 trades for +$33.50).
  predicted_move_shrink: 1.0
  # Extra cushion above breakeven, as a fraction, covering only spread/
  # slippage now that the OTM distance is computed explicitly (2026-09-10
  # follow-up: the previous 0.15 was standing in for that distance term,
  # which the ask/strike formula omitted entirely). Not fitted from data --
  # the trade audits don't retain the quoted ask, only the fill price --
  # 0.03 is a reasoned default.
  breakeven_margin_pct: 0.03
  close_deadline_est: "15:30"
  min_dte: 0
  max_dte: 0
  max_bid_ask_spread_pct: 20
  min_data_sources_for_direction: 2
  std_dev_threshold: 3.0

mcp:
  alpaca:
    command: uvx
    args: ["alpaca-mcp-server"]
    timeout_sec: 30
  robinhood:
    command: uvx
    args: ["robinhood-mcp-server"]
    timeout_sec: 30
    auth:
      username: ${ROBINHOOD_USERNAME}
      password: ${ROBINHOOD_PASSWORD}
      mfa_code: ${ROBINHOOD_MFA_CODE}
  options_chain:
    command: npx
    args: ["-y", "@blake365/options-chain"]
    timeout_sec: 15

logging:
  level: DEBUG
  json_dir: logs

gap_fade:
  thresholds_pct:
    SPY: 1.5
    QQQ: 2.0
  default_threshold_pct: 1.5
  sentiment_magnitude_max: 0.20

# Live pre-market price/volume via Alpaca 1-minute IEX bars (see
# src/ingestion/premarket.py). Fixes the 2026-09-11 bug where the atlas
# Finnhub snapshot (~06:02 PT, no pre-market price yet) was fed into
# every prompt AS today's quote -- Finnhub's "current price" outside
# market hours is really the PRIOR session's close. See PremarketConfig
# in src/config.py for the full incident writeup and the empirical basis
# for min_volume_ratio (median pre-market volume to the 09:28 ET cutoff:
# ~1,779 shares QQQ / ~610 SPY on IEX, ranging 0-8,425 day to day -- too
# noisy for an absolute floor, hence a relative threshold).
premarket:
  enabled: true
  cutoff_et: "09:28"
  session_start_et: "04:00"
  lookback_days: 10
  min_volume_ratio: 0.5
  # Mechanics price order: live quote midpoint -> recent bar close ->
  # prior close. A bar older than this many minutes (vs the cutoff
  # above) can't be used for mechanics and can't count as reliable
  # evidence either, no matter the volume ratio.
  max_bar_age_min: 15.0
  max_quote_spread_pct: 0.1

llm:
  enabled: true
  # Chain order: primary_model first, then fallback_models in order.
  # Muse Spark 1.3 (contributor-free, served through the opencode CLI) is
  # the model of record. Nemotron 3 Ultra via nvidia-direct is the only
  # fallback. DeepSeek is deliberately removed (owner decision,
  # 2026-09-11): Muse Spark is the chosen model, and both DeepSeek
  # accounts (opencode-go, OpenRouter) were out of credit anyway.
  primary_model: opencode/muse-spark-1.3-contributor-free
  fallback_models:
    - nvidia-direct/nvidia/nemotron-3-ultra-550b-a55b
  # Raised from 45s: the monolithic fallback prompt is large, and on
  # 2026-08-26 both models timed out at 45s, leaving the fallback useless
  # exactly when the graph had already failed.
  timeout_sec: 90
  max_calls_per_run: 14

  # Pre-flight model availability probe (see src/preflight.py). Runs ahead
  # of the pipeline, probes the model chain, and writes file_path. The
  # pipeline pins the healthiest model instead of discovering a dead or
  # slow one mid-run at the cost of a full node timeout.
  preflight:
    enabled: true
    file_path: .model-availability.json
    # Ignore results older than this — model health changes hour to hour.
    max_age_sec: 21600
    probe_timeout_sec: 45
    # "latency" pins the fastest healthy model; "order" keeps chain order
    # (atlas behaviour). "order" here so Muse Spark always leads whenever
    # it is healthy -- "latency" would promote Nemotron on any morning it
    # happened to answer faster, overriding the model of record.
    select_by: order

graph:
  enabled: true
  fallback_to_monolithic: true
  checker_contradiction_action: veto
  checker_confidence_penalty: 0.15
  # Timeouts are per ATTEMPT and are sized from observed p100 latency
  # (2026-08-14..28): research 58.0s, predict 22.6s, checker 42.0s,
  # pick-trade 28.7s. The old values gave the two SLOWEST nodes the least
  # headroom (research 2s, checker 3s), which is why the checker timed out
  # on 5 of 11 runs. Raising them lowers end-to-end latency rather than
  # raising it: a node that succeeds at 42s beats one that burns 45s,
  # retries the fallback for another 45s, then fails into the monolithic path.
  research_timeout_sec: 90
  prediction_timeout_sec: 40
  checker_timeout_sec: 90
  pick_trade_timeout_sec: 45
  # Wall-clock ceiling for the whole graph, sized against the 15-min
  # entry window (pipeline starts ~2 min before the open).
  total_deadline_sec: 360
  reserved_calls_for_fallback: 1
  # Below both strategy gates (0.40 / 0.45) so a lone deterministic signal
  # with no LLM corroboration cannot clear them unaided. See src/config.py.
  unsupported_confidence_cap: 0.35

execution:
  entry:
    order_type: limit
    # % lean above live ask for buy entries to guarantee a fill (avoids expiring unfilled)
    limit_offset_pct: 5
    entry_window_minutes: 15
  exit_strategy:
    # take_profit_pct is the resting Alpaca limit order used when
    # exit_advisor.enabled is false. When the advisor is enabled, this
    # value is NOT used for the resting order -- see
    # exit_advisor.safety_cap_pct instead. Kept at 100 as the fallback
    # value for an advisor-disabled run.
    take_profit_pct: 100
    stop_loss_pct: -50
    # trail_pct/activate_after_pct here are NOT an always-on rail -- how
    # they're enforced depends on exit_advisor.enabled:
    #   - exit_advisor.enabled: false -> never enforced by the monitor at
    #     all (dead config today; ExitManager.evaluate, which would read
    #     it, doesn't run in-process -- see AGENTS.md "Exit Strategies").
    #   - exit_advisor.enabled: true, advisor healthy -> only a
    #     FALLBACK: enforced deterministically when a consult
    #     fails/times out/can't be parsed, or the per-trade call cap is
    #     spent (src.execution.exit_advisor.trailing_fallback_triggered).
    #   - exit_advisor.enabled: true, AND the advisor has itself tightened
    #     the trail via its trail_stop_pct output -> that tightened trail
    #     (not this configured default) is enforced on EVERY poll, since
    #     it's the advisor's own deliberate standing order, not a
    #     fallback (src.execution.exit_advisor.advisor_trail_triggered).
    trailing:
      enabled: true
      activate_after_pct: 30
      trail_pct: 15
    time_deadline_est: "15:25"
  # LLM-driven profit-exit advisor (owner request, 2026-09-11): a replay
  # of 72 asset-days (2026-07-22..09-10) found this strategy's OTM 0DTE
  # options pay off on a handful of big days -- holding to expiry
  # averaged ~+71%/trade in premium units for the models, with the top 3
  # days carrying ~45% of total gains. Under the fixed +100%/-50%
  # TP/SL, that fell to ~+7-9%: the resting +100% limit order fills and
  # cuts off exactly the days that pay. This does not touch the
  # stop-loss (still -50%, and it looked fine in the same review -- it
  # saved money on 9/8 and was a wash on 9/9), the 15:25 ET time
  # deadline, or the 12:20 PM PT safety-close sweep, which all remain
  # deterministic hard rails ahead of anything below. See
  # src/execution/exit_advisor.py and .opencode/agent/exit-advisor.md.
  #
  # ENABLED HERE per explicit owner instruction, on paper trading only.
  # See the PR report for the (small-n, simulation-only, not backtested
  # against a real advisor run) recommendation on whether to keep it on.
  exit_advisor:
    enabled: true
    # Falls back to llm.primary_model (Muse Spark 1.3) when unset.
    # Deliberately no fallback chain: a single heavy model, consulted
    # sparingly, is the point -- a degraded/unavailable model instead
    # enforces the trailing stop above.
    model: null
    # Per-attempt timeout. Must stay well inside the 3-minute cron
    # interval (monitor lock would otherwise serialize a stuck run
    # against the next scheduled one).
    timeout_sec: 55
    # Cadence: consult on events, not every 3-minute poll.
    # - profit_step_pct: first crossing +50%, then every further +50%
    #   (+50, +100, +150, ...).
    # - giveback_from_peak_pct: a pullback of >= 25 points from the peak
    #   P&L once in profit, then again every further 25-point step down
    #   (peak-25, peak-50, peak-75, ...) -- not just once per peak, so a
    #   winner sliding all the way back down keeps getting consulted
    #   instead of going quiet after the first pullback. The ladder
    #   resets against a new, higher peak.
    # - periodic_interval_min: a check-in every ~15 minutes while the
    #   trade is in profit, independent of the two triggers above.
    # - final_window_min: one consult in the last ~30 minutes before the
    #   time deadline, regardless of P&L.
    profit_step_pct: 50
    giveback_from_peak_pct: 25
    periodic_interval_min: 15
    final_window_min: 30
    # Hard ceiling on consultations for a single trade, so a chattering
    # cadence (e.g. bouncing across a profit_step boundary) cannot spam
    # opencode all day.
    max_calls_per_trade: 12
    # Resting safety-cap limit order placed at Alpaca in place of the
    # fixed +100% TP, so total advisor unavailability still has *some*
    # ceiling rather than none. +400% means the option is worth 5x what was
    # paid -- far enough out that it essentially never fires on a genuine
    # winner, while still capping a runaway day if the advisor is down.
    # Set to `null` to place no
    # resting order at all and rely solely on the advisor + trailing
    # fallback + safety-close sweep.
    safety_cap_pct: 400
  tenacity:
    max_attempts: 3
    min_wait_sec: 1
    max_wait_sec: 30
    backoff_multiplier: 2
  max_concurrent_trades: 1
