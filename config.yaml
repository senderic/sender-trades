general:
  env_mode: PAPER_ALPACA
  target_assets:
    - SPY
    - QQQ
  execute: true
  require_forecast_alignment: true

atlas_briefing:
  directory: ~/atlas-morning-briefing
  briefings_subdir: briefings
  snapshot_enabled: true

finnhub:
  api_key: ${FINNHUB_API_KEY}
  request_timeout_sec: 10

alpha_vantage:
  api_key: ${ALPHA_VANTAGE_API_KEY}
  request_timeout_sec: 10

brave:
  api_key: ${BRAVE_API_KEY}
  news_query: "SPY QQQ stock market intraday trading"

reddit:
  enabled: true
  subreddits:
    - wallstreetbets
    - options
  post_limit: 25

unusual_whales:
  enabled: true
  api_key: ${UNUSUAL_WHALES_API_KEY}

rss_feeds:
  - url: https://feeds.content.dowjones.io/public/rss/mw_topstories
  - url: https://www.investing.com/rss/news.rss
  - url: https://seekingalpha.com/feed.xml
  - url: https://www.reutersagency.com/feed/

strategies:
  momentum:
    enabled: true
    min_confidence: 0.40
    gap_threshold_pct: 0.5
    max_confidence: 0.50
  mean_reversion:
    enabled: true
    min_confidence: 0.40
    rsi_oversold: 35
    rsi_overbought: 65
  event_driven:
    enabled: true
    min_confidence: 0.45
    catalyst_window_hours: 17

risk:
  max_loss_per_trade_usd: 500
  max_position_size_contracts: 10
  sizing_tier2_min_confidence: 0.60
  # Minimum absolute predicted move (in %) for a trade to be executed.
  # A 68%-accurate direction call on a 0.1-0.2% move still dies to 0DTE
  # theta, so only trade when the model expects a meaningful session move.
  min_predicted_move_pct: 0.30
  # Tie-break preference across assets at equal confidence. QQQ has shown
  # better accuracy and PnL than SPY across the whole history.
  preferred_asset: QQQ
  # Premium-aware entry gate (2026-09-10 audit of logs/, 2026-07-29..09-09):
  # predicted moves ran ~3x hotter than the underlying's actual intraday
  # move (e.g. 2026-09-09 predicted SPY -0.7%/QQQ -0.8%, actual -0.22%/
  # -0.01%). DecisionAggregator.premium_gate compares predicted move x
  # this factor against the option's true breakeven (OTM distance to
  # strike + ask, as a % of the underlying), in ExecutionEngine once the
  # live ask and a live underlying quote are known post-open.
  # Loosened 0.4 -> 1.0 (owner decision, 2026-09-11). A sweep over the 22
  # real fills showed no shrink value separates winners from losers --
  # kept-trade P&L was +$135..+$210 at every value from 0.4 to 1.2, carried
  # by one +$282 ITM put -- so this only sets frequency: 0.4 kept 2 of 22,
  # 1.0 keeps 9 (5 winners, +$195.50). Above ~1.2 the gate stops filtering
  # (1.5 kept 14 trades for +$33.50).
  predicted_move_shrink: 1.0
  # Extra cushion above breakeven, as a fraction, covering only spread/
  # slippage now that the OTM distance is computed explicitly (2026-09-10
  # follow-up: the previous 0.15 was standing in for that distance term,
  # which the ask/strike formula omitted entirely). Not fitted from data --
  # the trade audits don't retain the quoted ask, only the fill price --
  # 0.03 is a reasoned default.
  breakeven_margin_pct: 0.03
  close_deadline_est: "15:30"
  min_dte: 0
  max_dte: 0
  max_bid_ask_spread_pct: 20
  min_data_sources_for_direction: 2
  std_dev_threshold: 3.0

mcp:
  alpaca:
    command: uvx
    args: ["alpaca-mcp-server"]
    timeout_sec: 30
  robinhood:
    command: uvx
    args: ["robinhood-mcp-server"]
    timeout_sec: 30
    auth:
      username: ${ROBINHOOD_USERNAME}
      password: ${ROBINHOOD_PASSWORD}
      mfa_code: ${ROBINHOOD_MFA_CODE}
  options_chain:
    command: npx
    args: ["-y", "@blake365/options-chain"]
    timeout_sec: 15

logging:
  level: DEBUG
  json_dir: logs

gap_fade:
  thresholds_pct:
    SPY: 1.5
    QQQ: 2.0
  default_threshold_pct: 1.5
  sentiment_magnitude_max: 0.20

llm:
  enabled: true
  # Chain order: primary_model first, then fallback_models in order.
  # Muse Spark 1.3 (contributor-free, served through the opencode CLI) is
  # the model of record. Nemotron 3 Ultra via nvidia-direct is the only
  # fallback. DeepSeek is deliberately removed (owner decision,
  # 2026-09-11): Muse Spark is the chosen model, and both DeepSeek
  # accounts (opencode-go, OpenRouter) were out of credit anyway.
  primary_model: opencode/muse-spark-1.3-contributor-free
  fallback_models:
    - nvidia-direct/nvidia/nemotron-3-ultra-550b-a55b
  # Raised from 45s: the monolithic fallback prompt is large, and on
  # 2026-08-26 both models timed out at 45s, leaving the fallback useless
  # exactly when the graph had already failed.
  timeout_sec: 90
  max_calls_per_run: 14

  # Pre-flight model availability probe (see src/preflight.py). Runs ahead
  # of the pipeline, probes the model chain, and writes file_path. The
  # pipeline pins the healthiest model instead of discovering a dead or
  # slow one mid-run at the cost of a full node timeout.
  preflight:
    enabled: true
    file_path: .model-availability.json
    # Ignore results older than this — model health changes hour to hour.
    max_age_sec: 21600
    probe_timeout_sec: 45
    # "latency" pins the fastest healthy model; "order" keeps chain order
    # (atlas behaviour). "order" here so Muse Spark always leads whenever
    # it is healthy -- "latency" would promote Nemotron on any morning it
    # happened to answer faster, overriding the model of record.
    select_by: order

graph:
  enabled: true
  fallback_to_monolithic: true
  checker_contradiction_action: veto
  checker_confidence_penalty: 0.15
  # Timeouts are per ATTEMPT and are sized from observed p100 latency
  # (2026-08-14..28): research 58.0s, predict 22.6s, checker 42.0s,
  # pick-trade 28.7s. The old values gave the two SLOWEST nodes the least
  # headroom (research 2s, checker 3s), which is why the checker timed out
  # on 5 of 11 runs. Raising them lowers end-to-end latency rather than
  # raising it: a node that succeeds at 42s beats one that burns 45s,
  # retries the fallback for another 45s, then fails into the monolithic path.
  research_timeout_sec: 90
  prediction_timeout_sec: 40
  checker_timeout_sec: 90
  pick_trade_timeout_sec: 45
  # Wall-clock ceiling for the whole graph, sized against the 15-min
  # entry window (pipeline starts ~2 min before the open).
  total_deadline_sec: 360
  reserved_calls_for_fallback: 1
  # Below both strategy gates (0.40 / 0.45) so a lone deterministic signal
  # with no LLM corroboration cannot clear them unaided. See src/config.py.
  unsupported_confidence_cap: 0.35

execution:
  entry:
    order_type: limit
    # % lean above live ask for buy entries to guarantee a fill (avoids expiring unfilled)
    limit_offset_pct: 5
    entry_window_minutes: 15
  exit_strategy:
    take_profit_pct: 100
    stop_loss_pct: -50
    trailing:
      enabled: true
      activate_after_pct: 30
      trail_pct: 15
    time_deadline_est: "15:25"
  tenacity:
    max_attempts: 3
    min_wait_sec: 1
    max_wait_sec: 30
    backoff_multiplier: 2
  max_concurrent_trades: 1
