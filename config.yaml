general:
  env_mode: PAPER_ALPACA
  target_assets:
    - SPY
    - QQQ
  execute: true
  require_forecast_alignment: true

atlas_briefing:
  directory: ~/atlas-morning-briefing
  briefings_subdir: briefings
  snapshot_enabled: true

finnhub:
  api_key: ${FINNHUB_API_KEY}
  request_timeout_sec: 10

alpha_vantage:
  api_key: ${ALPHA_VANTAGE_API_KEY}
  request_timeout_sec: 10

brave:
  api_key: ${BRAVE_API_KEY}
  news_query: "SPY QQQ stock market intraday trading"

reddit:
  enabled: true
  subreddits:
    - wallstreetbets
    - options
  post_limit: 25

unusual_whales:
  enabled: true
  api_key: ${UNUSUAL_WHALES_API_KEY}

rss_feeds:
  - url: https://feeds.content.dowjones.io/public/rss/mw_topstories
  - url: https://www.investing.com/rss/news.rss
  - url: https://seekingalpha.com/feed.xml
  - url: https://www.reutersagency.com/feed/

strategies:
  momentum:
    enabled: true
    min_confidence: 0.40
    gap_threshold_pct: 0.5
  mean_reversion:
    enabled: true
    min_confidence: 0.40
    rsi_oversold: 35
    rsi_overbought: 65
  event_driven:
    enabled: true
    min_confidence: 0.45
    catalyst_window_hours: 17

risk:
  max_loss_per_trade_usd: 500
  max_position_size_contracts: 10
  close_deadline_est: "15:30"
  min_dte: 0
  max_dte: 0
  max_bid_ask_spread_pct: 20
  min_data_sources_for_direction: 2
  std_dev_threshold: 3.0

mcp:
  alpaca:
    command: uvx
    args: ["alpaca-mcp-server"]
    timeout_sec: 30
  robinhood:
    command: uvx
    args: ["robinhood-mcp-server"]
    timeout_sec: 30
    auth:
      username: ${ROBINHOOD_USERNAME}
      password: ${ROBINHOOD_PASSWORD}
      mfa_code: ${ROBINHOOD_MFA_CODE}
  options_chain:
    command: npx
    args: ["-y", "@blake365/options-chain"]
    timeout_sec: 15

logging:
  level: DEBUG
  json_dir: logs

gap_fade:
  thresholds_pct:
    SPY: 1.5
    QQQ: 2.0
  default_threshold_pct: 1.5
  sentiment_magnitude_max: 0.20

llm:
  enabled: true
  # Chain order: primary_model first, then fallback_models in order.
  # Both are DeepSeek V4 Pro — the only model used for analysis/prediction.
  primary_model: opencode-go/deepseek-v4-pro
  fallback_models:
    - openrouter/deepseek/deepseek-v4-pro
  timeout_sec: 45
  max_calls_per_run: 14

graph:
  enabled: true
  fallback_to_monolithic: true
  checker_contradiction_action: veto
  checker_confidence_penalty: 0.15
  research_timeout_sec: 60
  prediction_timeout_sec: 45
  checker_timeout_sec: 45
  pick_trade_timeout_sec: 45
  # Wall-clock ceiling for the whole graph, sized against the 15-min
  # entry window (pipeline starts ~2 min before the open).
  total_deadline_sec: 300
  reserved_calls_for_fallback: 1

execution:
  entry:
    order_type: limit
    # % lean above live ask for buy entries to guarantee a fill (avoids expiring unfilled)
    limit_offset_pct: 5
    entry_window_minutes: 15
  exit_strategy:
    take_profit_pct: 100
    stop_loss_pct: -50
    trailing:
      enabled: true
      activate_after_pct: 30
      trail_pct: 15
    time_deadline_est: "15:25"
  tenacity:
    max_attempts: 3
    min_wait_sec: 1
    max_wait_sec: 30
    backoff_multiplier: 2
  max_concurrent_trades: 1
